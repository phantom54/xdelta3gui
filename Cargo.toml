[package]
name = "xdelta3gui"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
debug = false
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true